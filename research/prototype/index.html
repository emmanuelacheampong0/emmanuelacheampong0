  <script>
    const cases = [
      {
        title: "Jordan’s week",
        facts: [["Available after essentials", "$120"], ["Lab fee due tomorrow", "$45"], ["Optional purchase today", "$120"]],
        suggestion: "Use the full $120 for the optional purchase today.",
        reason: "The suggestion treats the available balance as flexible spending.",
        evidence: "The case also says a $45 course lab fee is due tomorrow.",
        prompt: "Which detail would you check before deciding?"
      },
      {
        title: "Maya’s textbook",
        facts: [["Available after essentials", "$80"], ["Required textbook", "$50"], ["Book needed next week", "Yes"]],
        suggestion: "Set aside $50 for the textbook and keep the remaining $30 available.",
        reason: "The plan reserves the stated book cost and does not allocate more than the balance.",
        evidence: "The case lists an $80 balance and a required $50 textbook.",
        prompt: "Does the suggestion account for the stated cost and timing?"
      },
      {
        title: "Avery’s bus pass",
        facts: [["Available after essentials", "$65"], ["Weekly bus pass", "$25"], ["Pass needed for classes", "Yes"]],
        suggestion: "Buy the $25 pass and leave $40 for other listed needs.",
        reason: "The suggestion covers the stated transportation need and preserves the rest of the balance.",
        evidence: "The case lists a $65 balance and a $25 weekly pass.",
        prompt: "What could change this plan, even if the arithmetic checks out?"
      }
    ];

    let activeCase = 0;
    let evidenceView = true;
    const $ = (id) => document.getElementById(id);

    function renderScenarioButtons() {
      const list = $("scenarioList");
      list.replaceChildren();
      cases.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "scenario-button";
        button.type = "button";
        button.textContent = `0${index + 1}  ${item.title}`;
        button.setAttribute("aria-current", String(index === activeCase));
        button.addEventListener("click", () => { activeCase = index; render(); });
        list.append(button);
      });
    }

    function render() {
      const item = cases[activeCase];
      $("caseLabel").textContent = `Case 0${activeCase + 1} · fictional`;
      $("caseTitle").textContent = item.title;
      $("suggestion").textContent = item.suggestion;
      $("reason").textContent = item.reason;
      $("evidence").textContent = item.evidence;
      $("prompt").textContent = item.prompt;
      $("details").hidden = !evidenceView;
      $("reflection").hidden = !evidenceView;
      $("plainMode").setAttribute("aria-pressed", String(!evidenceView));
      $("cardMode").setAttribute("aria-pressed", String(evidenceView));
      $("response").textContent = "";
      const facts = $("facts");
      facts.replaceChildren();
      item.facts.forEach(([label, value]) => {
        const cell = document.createElement("div");
        cell.className = "fact";
        const name = document.createElement("span");
        name.textContent = label;
        const amount = document.createElement("strong");
        amount.textContent = value;
        cell.append(name, amount);
        facts.append(cell);
      });
      renderScenarioButtons();
    }

    $("plainMode").addEventListener("click", () => { evidenceView = false; render(); });
    $("cardMode").addEventListener("click", () => { evidenceView = true; render(); });
    document.querySelectorAll("[data-choice]").forEach((button) => {
      button.addEventListener("click", () => {
        $("response").textContent = `Demo choice: ${button.dataset.choice}. It was not saved.`;
      });
    });
    render();
  </script>
