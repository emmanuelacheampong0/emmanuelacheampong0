<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="122" viewBox="0 0 1200 122" role="img" aria-labelledby="title desc">
  <title id="title">Emmanuel’s creative technology interests</title>
  <desc id="desc">Computer Science, Software Engineering, Artificial Intelligence and Research, Product Thinking, and Visual Design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1327"/><stop offset="1" stop-color="#19264a"/></linearGradient>
    <linearGradient id="rail" x1="0" x2="1"><stop stop-color="#71c8ff"/><stop offset=".48" stop-color="#a3e6d3"/><stop offset="1" stop-color="#ffb673"/></linearGradient>
  </defs>
  <rect width="1200" height="122" rx="15" fill="url(#bg)"/>
  <text x="32" y="29" fill="#a0b0cb" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">THE THINGS I’M EXPLORING</text>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".7">
    <rect x="25" y="42" width="215" height="58" rx="9" fill="#20356e"/><text x="132" y="77" fill="#fff" text-anchor="middle">SOFTWARE</text>
    <rect x="250" y="42" width="235" height="58" rx="9" fill="#2d4c96"/><text x="367" y="77" fill="#fff" text-anchor="middle">AI + RESEARCH</text>
    <rect x="495" y="42" width="210" height="58" rx="9" fill="#394788"/><text x="600" y="77" fill="#fff" text-anchor="middle">PRODUCT</text>
    <rect x="715" y="42" width="235" height="58" rx="9" fill="#563d85"/><text x="832" y="77" fill="#fff" text-anchor="middle">VISUAL DESIGN</text>
    <rect x="960" y="42" width="215" height="58" rx="9" fill="#325c62"/><text x="1067" y="77" fill="#fff" text-anchor="middle">PEOPLE FIRST</text>
  </g>
  <rect x="25" y="108" width="215" height="3" rx="2" fill="url(#rail)" opacity=".6"/>
  <rect x="25" y="108" width="52" height="3" rx="2" fill="#a7e7d4">
    <animate attributeName="x" values="25;250;495;715;960;960;25" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
