<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Emmanuel’s open laboratory</title>
  <desc id="desc">A cinematic black, yellow and red profile banner introducing Emmanuel Acheampong as a Computer Science student, design enthusiast and curious builder.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171719"/><stop offset="1" stop-color="#09090b"/></linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffc00"/><stop offset="1" stop-color="#ffc928"/></linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#fff" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#screen)"/>
  <rect width="1200" height="520" rx="22" fill="url(#grain)" opacity=".42"/>
  <path d="M0 0h18v520H0z" fill="#e50914"/>
  <text x="62" y="60" fill="#fffc00" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">EMMANUEL SEFAH ACHEAMPONG  /  THE PUBLIC LAB</text>
  <rect x="62" y="92" width="220" height="32" rx="16" fill="#ffffff14" stroke="#ffffff30"/>
  <circle cx="81" cy="108" r="5" fill="#e50914"/>
  <text x="96" y="113" fill="#f4f2f0" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">NOW PLAYING · LEARNING IN PUBLIC</text>
  <text x="58" y="232" fill="#fff" font-family="Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-5">Hello, I’m</text>
  <text x="58" y="327" fill="#fffc00" font-family="Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-5">Emmanuel.</text>
  <text x="64" y="377" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="600">A technical mind. A designer’s eye.</text>
  <text x="64" y="410" fill="#c3c0c6" font-family="Arial,sans-serif" font-size="15">Computer Science @ Elon University · Ghana</text>
  <text x="64" y="467" fill="#fffc00" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".8">I’M BUILDING WHAT I LEARNED TWO MINUTES AGO.</text>
  <path d="M64 485h550" stroke="#fff" stroke-opacity=".24"/>
  <text x="64" y="506" fill="#aaa6ae" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">SOFTWARE  ·  PRODUCT  ·  AI  ·  VISUAL STORYTELLING</text>
  <g transform="translate(752 92)">
    <rect x="62" y="16" width="300" height="326" rx="19" fill="#e50914" transform="rotate(7 212 179)"/>
    <rect x="28" y="4" width="300" height="326" rx="19" fill="url(#poster)" transform="rotate(-5 178 167)"/>
    <circle cx="181" cy="158" r="92" fill="#151517"/>
    <circle cx="181" cy="158" r="77" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M165 119v78l65-39z" fill="#fffc00"/>
    <text x="65" y="42" fill="#161616" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">A CURIOSITY PLAYGROUND</text>
    <text x="75" y="278" fill="#111" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-1">PRESS PLAY.</text>
    <text x="76" y="301" fill="#28251b" font-family="Arial,sans-serif" font-size="12" letter-spacing="1">GAMES · DESIGN · QUESTIONS</text>
    <rect x="7" y="353" width="137" height="55" rx="10" fill="#18181b" stroke="#ffffff40"/>
    <rect x="156" y="353" width="137" height="55" rx="10" fill="#18181b" stroke="#ffffff40"/>
    <rect x="305" y="353" width="137" height="55" rx="10" fill="#18181b" stroke="#ffffff40"/>
    <text x="75" y="386" fill="#fffc00" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">GAMES</text>
    <text x="224" y="386" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">PRODUCT</text>
    <text x="373" y="386" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">STORIES</text>
  </g>
</svg>
