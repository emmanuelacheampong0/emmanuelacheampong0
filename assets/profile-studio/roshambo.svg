<svg xmlns="http://www.w3.org/2000/svg" width="600" height="345" viewBox="0 0 600 345" role="img" aria-labelledby="title"><title id="title">Roshambo. Small game. Big learning. Click to play.</title><defs><linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ff"/><stop offset=".25" stop-color="#dbbdf8"/><stop offset=".52" stop-color="#9f64e0"/><stop offset=".8" stop-color="#5326a7"/><stop offset="1" stop-color="#b8f0df"/></linearGradient></defs><rect width="600" height="345" rx="4" fill="#191722"/><text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#efe9f9" letter-spacing="2">01 / ROSHAMBO</text><text x="28" y="105" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="#efe9f9" >Small game.</text><text x="28" y="161" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="#dfff79" >Big learning.</text><g><circle cx="116" cy="256" r="58" fill="#dfff79"/><text x="116" y="276" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" fill="#191722" text-anchor="middle">R</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.0s" repeatCount="indefinite"/></g><g><circle cx="300" cy="244" r="58" fill="#f3b8d4"/><text x="300" y="264" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" fill="#191722" text-anchor="middle">P</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="3.5s" repeatCount="indefinite"/></g><g><circle cx="484" cy="256" r="58" fill="#ede9f7"/><text x="484" y="276" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" fill="#191722" text-anchor="middle">S</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4.0s" repeatCount="indefinite"/></g></svg>