name: Update GitHub profile activity
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_activity.py
      - .github/workflows/profile-activity.yml
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render public contribution data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: emmanuelacheampong0
        run: python scripts/profile_activity.py
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public GitHub activity card'
            git push
          fi
